version: '3.9'

services:
  postgres:
    image: postgres:17
    container_name: store-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev8090100
      POSTGRES_DB: store_db

    ports:
      - '5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
